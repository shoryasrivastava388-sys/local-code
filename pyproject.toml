[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-agent"
version = "1.0.0"
description = "Autonomous local coding and computer agent powered by Qwen on Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kushagra", email = "kushagra@localhost" }
]
keywords = ["ai", "agent", "qwen", "ollama", "coding-agent", "autonomous", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
qwen-agent = "qwen_agent:main"
qc = "qwen_agent:main"

[tool.setuptools]
py-modules = ["qwen_agent"]
