[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code"
version = "1.4.0"
description = "Universal autonomous local coding and computer agent powered by Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kushagra", email = "kushagra@localhost" }
]
keywords = ["ai", "agent", "ollama", "local-code", "coding-agent", "autonomous", "developer-tools", "qwen", "deepseek", "llama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
lc = "local_code:main"
local-code = "local_code:main"
qc = "local_code:main"
qwen-agent = "local_code:main"

[tool.setuptools]
py-modules = ["local_code"]
